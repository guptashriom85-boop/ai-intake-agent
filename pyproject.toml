[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-intake-agent"
version = "1.0.0"
description = "AI clinic and legal intake agent with safety routing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi[standard]",
  "openai",
  "pydantic-settings",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
