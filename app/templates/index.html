<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Intake Agent</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap"><section class="hero"><p class="eyebrow">AI INTAKE AGENT v2</p><h1>Clinic & Legal Intake</h1><p>Capture a new intake, detect urgency, and route high-risk cases to a human professional.</p></section><section class="card"><div class="mode"><button class="active" data-mode="clinic">Clinic</button><button data-mode="legal">Legal</button></div><form id="intake"><input id="name" required placeholder="Full name"><input id="contact" required placeholder="Phone or email"><textarea id="message" required placeholder="Describe what you need help with..."></textarea><button class="primary">Submit intake</button></form><div id="result"></div></section><section class="card"><h2>Request an appointment</h2><form id="appointment"><input id="aname" required placeholder="Full name"><input id="acontact" required placeholder="Phone or email"><input id="slot" required placeholder="Preferred day/time"><textarea id="notes" placeholder="Notes (optional)"></textarea><button class="primary">Request appointment</button></form><div id="apptResult"></div></section></main><script src="/static/app.js"></script></body></html>
